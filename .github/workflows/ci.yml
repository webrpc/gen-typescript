name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.23"

      - name: Install webrpc-gen
        run: git clone --single-branch https://github.com/webrpc/webrpc.git --branch v0.37.4 && cd webrpc && make install

      - name: Regenerate examples
        run: cd _examples && make generate

      - name: Git diff of regenerated files
        run: cd _examples && make diff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Type check generated files and run unit tests
        run: |
          cd tests-unit
          pnpm install --frozen-lockfile
          pnpm generate:enum
          pnpm typecheck
          pnpm test
